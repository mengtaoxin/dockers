services:
  github-actions-runner-a:
    image: ghcr.io/${GITHUB_OWNER:-local}/github-actions-runner-a:${VERSION:-0.2.0}
    build:
      context: ..
      dockerfile: github-actions-runner-a/Dockerfile
    environment:
      GITHUB_URL: ${GITHUB_URL:?set GITHUB_URL}
      GITHUB_PAT: ${GITHUB_PAT:?set GITHUB_PAT}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_SCHEMA_NAME: ${MYSQL_SCHEMA_NAME:-}
      MYSQL_BIND_ADDRESS: ${MYSQL_BIND_ADDRESS:-127.0.0.1}
      # 1 = speed-oriented mysqld (less durable; for tests/CI). Default 0.
      MYSQL_TEST_MODE: ${MYSQL_TEST_MODE:-0}
      RUNNER_NAME: ${RUNNER_NAME:-}
      RUNNER_LABELS: ${RUNNER_LABELS:-}
      RUNNER_GROUP: ${RUNNER_GROUP:-Default}
      # Optional SMB/CIFS share, auto-mounted at /mnt/smb on start.
      SMB_HOST: ${SMB_HOST:-}
      SMB_USERNAME: ${SMB_USERNAME:-}
      SMB_PASSWORD: ${SMB_PASSWORD:-}
      SMB_SHARE: ${SMB_SHARE:-}
    # Mounting CIFS needs privileges. Easiest:
    #   privileged: true
    # Or the narrower set (host/AppArmor dependent):
    #   cap_add:
    #     - SYS_ADMIN
    #     - DAC_READ_SEARCH
    #   security_opt:
    #     - apparmor:unconfined
    volumes:
      - mysql-data:/var/lib/mysql
      # Optional: host Docker daemon for workflow steps that need docker.
      # - /var/run/docker.sock:/var/run/docker.sock
      # Optional: stack-specific caches (npm, Playwright, _tool, …) — see README.
      # - npm-cache:/home/runner/.npm
    # Optional: empty executable workspace per job (uid/gid/size are host-specific).
    # tmpfs:
    #   - /home/runner/_work:uid=1001,gid=1001,mode=1777,exec,size=8g
    # restart pulls a new ephemeral registration after each job exits.
    restart: unless-stopped

volumes:
  mysql-data:
