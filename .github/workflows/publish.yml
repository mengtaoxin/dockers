name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.changes.outputs.stacks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed stacks
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          list_stacks() {
            for dir in */; do
              name="${dir%/}"
              if [[ -f "${name}/Dockerfile" && -f "${name}/VERSION" ]]; then
                printf '%s\n' "${name}"
              fi
            done
          }

          before="${{ github.event.before }}"
          if [[ -z "${before}" || "${before}" =~ ^0+$ ]]; then
            mapfile -t stacks < <(list_stacks)
          else
            mapfile -t changed < <(git diff --name-only "${before}" "${{ github.sha }}" | awk -F/ 'NF>1 {print $1}' | sort -u)
            stacks=()
            for name in "${changed[@]}"; do
              if [[ -f "${name}/Dockerfile" && -f "${name}/VERSION" ]]; then
                stacks+=("${name}")
              fi
            done
          fi

          if [[ ${#stacks[@]} -eq 0 ]]; then
            echo "stacks=[]" >> "${GITHUB_OUTPUT}"
            echo "No publishable stacks changed."
            exit 0
          fi

          json=$(printf '%s\n' "${stacks[@]}" | jq -R . | jq -cs .)
          echo "stacks=${json}" >> "${GITHUB_OUTPUT}"
          echo "Publishing stacks: ${json}"

  publish:
    needs: detect
    if: needs.detect.outputs.stacks != '[]' && needs.detect.outputs.stacks != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.stacks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < "${{ matrix.stack }}/VERSION")"
          if [[ -z "${version}" ]]; then
            echo "VERSION is empty in ${{ matrix.stack }}/VERSION" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          stack="$(echo '${{ matrix.stack }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/${stack}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.stack }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.name }}:latest
