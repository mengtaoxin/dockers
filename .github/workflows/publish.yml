name: Publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.changes.outputs.stacks }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed stacks
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          json="$(bash .github/scripts/detect-stacks.sh "${before}" "${after}")"
          echo "stacks=${json}" >> "${GITHUB_OUTPUT}"
          echo "Publishing stacks: ${json}"

  test:
    needs: detect
    if: needs.detect.outputs.stacks != '[]' && needs.detect.outputs.stacks != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.stacks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run stack tests
        shell: bash
        run: |
          set -euo pipefail
          stack="${{ matrix.stack }}"
          if [[ -x "${stack}/scripts/test.sh" ]]; then
            bash "${stack}/scripts/test.sh"
          elif [[ -x "${stack}/test.sh" ]]; then
            bash "${stack}/test.sh"
          else
            echo "missing executable ${stack}/scripts/test.sh or ${stack}/test.sh" >&2
            exit 1
          fi

  publish:
    needs: [detect, test]
    if: |
      always() &&
      needs.detect.result == 'success' &&
      needs.detect.outputs.stacks != '[]' &&
      needs.detect.outputs.stacks != '' &&
      needs.test.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.detect.outputs.stacks) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < "${{ matrix.stack }}/VERSION")"
          if [[ -z "${version}" ]]; then
            echo "VERSION is empty in ${{ matrix.stack }}/VERSION" >&2
            exit 1
          fi
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          stack="$(echo '${{ matrix.stack }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/${stack}" >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.stack }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.value }}
            ${{ steps.image.outputs.name }}:latest
