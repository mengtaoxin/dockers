services:
  mysql-server-a:
    image: ghcr.io/${GITHUB_OWNER:-local}/mysql-server-a:${VERSION:-0.3.1}
    build:
      context: ..
      dockerfile: mysql-server-a/Dockerfile
      args:
        STACK_VERSION: ${VERSION:-0.3.1}
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
      MYSQL_BIND_ADDRESS: ${MYSQL_BIND_ADDRESS:-0.0.0.0}
      # Auth plugin switch (not the root password). Default off = caching_sha2_password.
      MYSQL_NATIVE_PASSWORD: ${MYSQL_NATIVE_PASSWORD:-0}
      TZ: ${TZ:-UTC}
      BACKUP_DIR: /backup
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-60}
      BACKUP_KEEP_COUNT: ${BACKUP_KEEP_COUNT:-100}
      BACKUP_TOOL_VERSION: ${VERSION:-0.3.1}
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
      - "${PHPMYADMIN_HOST_PORT:-8080}:80"
    volumes:
      - ./data:/var/lib/mysql
      - ./logs:/logs
      - ./backup:/backup
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin --socket=/var/run/mysqld/mysqld.sock --user=root --password=$$MYSQL_ROOT_PASSWORD ping --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
